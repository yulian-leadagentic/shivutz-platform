name: CI

# R31 §2 · one job, one exit code.
#
# This file used to have three jobs (frontend / user-org / checks) and
# it ran four of the six safety scripts. The other two ran by hand,
# which in practice means they ran when the person who wrote them was
# looking. That is the failure this section exists to close.
#
# So CI no longer keeps its own list of what to run. It installs the
# toolchain and calls `npm run preflight`, which is the same command a
# human runs locally — scripts/preflight.mjs owns the list, and there
# is exactly one place for it to drift out of.
#
# Collapsing three parallel jobs into one costs a couple of minutes of
# wall clock. The frontend build was the long pole in every run anyway,
# and the preflight summary prints a line per step, so nothing that was
# visible as a job name became invisible.
#
# Still no DB and no E2E — those need budget we do not have pre-launch
# and would turn CI into something everyone silently disables. The
# smoke suites and the production seed check report SKIP here, loudly,
# with the reason; they are run against real environments by hand.

on:
  push:
    branches: [main, staging, pivot/v2]
  pull_request:
    branches: [main, staging, pivot/v2]

jobs:
  preflight:
    name: preflight (build · tests · safety checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frontend deps
        working-directory: services/frontend
        run: npm ci

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f services/user-org/requirements.txt ]; then
            pip install -r services/user-org/requirements.txt
          fi
          pip install pytest pytest-asyncio

      # The whole gate. Exit code 1 if any required step failed;
      # skips are reported but never fail the run, because a PR must
      # not be blocked by a secret the runner was never given.
      - name: npm run preflight
        run: npm run preflight
